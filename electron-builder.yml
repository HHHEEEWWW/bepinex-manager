# electron-builder 配置
# 目标：安装版（NSIS，用户可选安装目录）+ 便携版（zip，解压即用）
# 数据目录策略：全部数据集中在 <安装目录>/data/（随安装目录走，便携，不散落系统目录）

appId: com.bepinexmanager.app
productName: BepInExManager
copyright: Copyright © 2026

directories:
  output: dist

files:
  - out/**

# 元数据解析工具（.NET 自包含发布，零运行时依赖）打进安装目录 tools/plugin-metadata-reader/
# 自包含产物来自 `pnpm release:tool`（dotnet publish -r win-x64 --self-contained）
extraResources:
  - from: tools/plugin-metadata-reader/bin/Release/net9.0/win-x64/publish/
    to: tools/plugin-metadata-reader

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false          # 向导式安装
  perMachine: false        # 按用户安装（无需管理员）
  allowToChangeInstallationDirectory: true   # 用户可选择安装目录
  # 自定义卸载逻辑：升级/卸载时保留 <安装目录>/data/（用户数据），防止误操作丢失
  include: build/installer.nsh
  createDesktopShortcut: true
  shortcutName: BepInEx 管理器
  artifactName: BepInExManager-${version}-setup.${ext}

# 便携版命名
artifactName: BepInExManager-${version}-portable.${ext}
